<!-- location-details.html -->

<div class="location-container">
  <div
    class="location-row"
    *ngFor="let location of locations"
  >
    <div class="location-card">
      {{ location.locationName }}
    </div>

    <div
      class="allocation-panel"
      cdkDropList
      [cdkDropListData]="location.assignedAssets"
      (cdkDropListDropped)="drop($event, location)"
    >
      <div
        class="asset-card"
        *ngFor="let asset of location.assignedAssets"
        cdkDrag
        [cdkDragData]="asset"
      >
        <span>
          {{ asset.assetName }}
        </span>

        <button
          class="delete-btn"
          (click)="removeAsset(location, asset)"
        >
          ×
        </button>
      </div>

      <div
        class="drop-placeholder"
        *ngIf="location.assignedAssets.length === 0"
      >
        DROP HERE
      </div>
    </div>
  </div>
</div>
